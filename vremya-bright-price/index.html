<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Время быть ярче — цена билета</title>
<meta name="description" content="Актуальная цена билета на вечеринку «Время быть ярче»">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#0a0618;
    --bg-2:#1a0b33;
    --bg-3:#0c1a3d;
    --pink:#ff2d95;
    --pink-2:#ff6ec7;
    --cyan:#33e6ff;
    --white:#ffffff;
    --red:#e01330;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--bg-1);
  }

  body{
    min-height:100vh;
    min-height:100dvh;
    font-family:'Manrope',system-ui,-apple-system,sans-serif;
    color:var(--white);
    overflow-x:hidden;
    position:relative;
    background:
      radial-gradient(ellipse 90% 55% at 20% 0%, rgba(255,45,149,0.28), transparent 60%),
      radial-gradient(ellipse 80% 50% at 85% 15%, rgba(51,230,255,0.20), transparent 60%),
      radial-gradient(ellipse 100% 60% at 50% 100%, rgba(120,30,220,0.35), transparent 65%),
      linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
  }

  /* --- ambient glow orbs --- */
  .glow-orb{
    position:fixed;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.5;
    pointer-events:none;
    z-index:0;
    animation:pulse 7s ease-in-out infinite;
  }
  .glow-orb.a{
    width:60vw;height:60vw;max-width:420px;max-height:420px;
    top:-10%;left:-15%;
    background:radial-gradient(circle, rgba(255,45,149,0.55), transparent 70%);
    animation-delay:0s;
  }
  .glow-orb.b{
    width:70vw;height:70vw;max-width:480px;max-height:480px;
    bottom:-15%;right:-20%;
    background:radial-gradient(circle, rgba(51,230,255,0.4), transparent 70%);
    animation-delay:2s;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); opacity:0.4; }
    50%{ transform:scale(1.15); opacity:0.65; }
  }

  /* --- floating sparkle particles --- */
  .particles{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:1;
  }
  .particle{
    position:absolute;
    bottom:-10px;
    border-radius:50%;
    background:var(--white);
    opacity:0;
    animation-name:float-up;
    animation-timing-function:ease-in;
    animation-iteration-count:infinite;
  }
  @keyframes float-up{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:var(--peak-opacity, 0.9); }
    90%{ opacity:var(--peak-opacity, 0.9); }
    100%{ transform:translateY(-110vh) translateX(var(--drift, 20px)); opacity:0; }
  }

  /* --- layout --- */
  main{
    position:relative;
    z-index:2;
    width:100%;
    max-width:480px;
    padding:28px 20px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:22px;
  }

  .logo{
    width:78%;
    max-width:340px;
    height:auto;
    margin:18px 0 0;
    filter:
      drop-shadow(0 0 10px rgba(255,255,255,0.55))
      drop-shadow(0 0 26px rgba(255,110,199,0.55))
      drop-shadow(0 6px 20px rgba(0,0,0,0.45));
  }

  .subtitle{
    font-size:1.05rem;
    line-height:1.35;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--white);
    text-shadow:0 0 16px rgba(255,45,149,0.7);
    margin-top:-10px;
    font-weight:800;
  }

  .price-next{
    font-size:1.05rem;
    font-weight:800;
    color:var(--cyan);
    text-shadow:0 0 14px rgba(51,230,255,0.6);
  }

  /* --- price card --- */
  .price-card{
    width:100%;
    border-radius:28px;
    padding:28px 20px 26px;
    background:linear-gradient(165deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03));
    border:1px solid rgba(255,255,255,0.14);
    backdrop-filter:blur(10px);
    box-shadow:
      0 0 0 1px rgba(255,45,149,0.08) inset,
      0 20px 50px -20px rgba(255,45,149,0.35),
      0 0 60px -15px rgba(51,230,255,0.25);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }

  .price-label{
    font-size:0.95rem;
    font-weight:700;
    letter-spacing:0.03em;
    color:rgba(255,255,255,0.75);
  }

  .price-value{
    font-size:clamp(3.2rem, 15vw, 4.6rem);
    font-weight:800;
    line-height:1;
    background:linear-gradient(135deg, #ffffff 10%, #ffd9f0 45%, var(--cyan) 90%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 22px rgba(255,110,199,0.55)) drop-shadow(0 0 40px rgba(51,230,255,0.3));
    letter-spacing:0.01em;
  }

  .price-note{
    font-size:0.98rem;
    font-weight:700;
    color:var(--pink-2);
  }

  .price-note.plain{
    color:rgba(255,255,255,0.6);
    font-weight:600;
  }

  /* --- countdown --- */
  .countdown-wrap{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    padding-top:4px;
  }

  .countdown-wrap[hidden]{
    display:none;
  }

  .countdown-cta{
    font-size:1.05rem;
    font-weight:800;
    color:var(--white);
    text-shadow:0 0 18px rgba(255,45,149,0.7);
  }

  .countdown{
    display:flex;
    gap:10px;
  }

  .countdown .unit{
    min-width:64px;
    padding:10px 8px 8px;
    border-radius:16px;
    background:rgba(0,0,0,0.35);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 0 22px -6px rgba(51,230,255,0.5) inset;
  }

  .countdown .num{
    display:block;
    font-size:clamp(1.6rem, 8vw, 2.1rem);
    font-weight:800;
    font-variant-numeric:tabular-nums;
    color:var(--cyan);
    text-shadow:0 0 14px rgba(51,230,255,0.7);
  }

  .countdown .unit-label{
    display:block;
    font-size:0.62rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:rgba(255,255,255,0.55);
    margin-top:2px;
  }

  /* --- CTA button --- */
  .cta-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    max-width:380px;
    padding:17px 22px;
    border-radius:999px;
    background:linear-gradient(95deg, #ff2d95, #ff6ec7 50%, #33e6ff);
    color:#140019;
    font-size:1.08rem;
    font-weight:800;
    text-decoration:none;
    box-shadow:
      0 14px 34px -10px rgba(255,45,149,0.65),
      0 0 0 1px rgba(255,255,255,0.25) inset;
    animation:btn-pulse 2.6s ease-in-out infinite;
    -webkit-tap-highlight-color:transparent;
  }
  .cta-btn:active{ transform:scale(0.97); }

  @keyframes btn-pulse{
    0%,100%{ box-shadow:0 14px 34px -10px rgba(255,45,149,0.65), 0 0 0 1px rgba(255,255,255,0.25) inset, 0 0 0 0 rgba(255,45,149,0.4); }
    50%{ box-shadow:0 14px 40px -8px rgba(255,45,149,0.85), 0 0 0 1px rgba(255,255,255,0.35) inset, 0 0 0 10px rgba(255,45,149,0); }
  }

  .cta-btn svg{ width:22px; height:22px; flex-shrink:0; }

  .event-name{
    font-size:0.85rem;
    color:rgba(255,255,255,0.4);
    font-weight:600;
    margin-top:4px;
  }

  @media (max-width:340px){
    .countdown .unit{ min-width:56px; padding:8px 4px 6px; }
  }
</style>
</head>
<body>

<div class="glow-orb a"></div>
<div class="glow-orb b"></div>
<div class="particles" id="particles"></div>

<main>
  <img class="logo" src="assets/logo.png" alt="Время быть ярче">
  <div class="subtitle">Новогодние вечеринки для 3-4 и 5-7 классов</div>

  <section class="price-card">
    <div class="price-label" id="priceLabel">Актуальная цена билета</div>
    <div class="price-value" id="priceValue">—</div>
    <div class="price-note" id="priceNote"></div>

    <div class="countdown-wrap" id="countdownWrap" hidden>
      <div class="countdown-cta">ДЕЙСТВИТЕЛЬНА ДО 30 СЕНТЯБРЯ</div>
      <div class="countdown">
        <div class="unit">
          <span class="num" id="cdDays">00</span>
          <span class="unit-label">дней</span>
        </div>
        <div class="unit">
          <span class="num" id="cdHours">00</span>
          <span class="unit-label">часов</span>
        </div>
        <div class="unit">
          <span class="num" id="cdMinutes">00</span>
          <span class="unit-label">минут</span>
        </div>
      </div>
      <div class="price-next">с 1 октября цена 2900</div>
    </div>
  </section>

  <a class="cta-btn" id="waBtn" href="#" target="_blank" rel="noopener">
    <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M16.02 3C9.4 3 4 8.38 4 15c0 2.34.68 4.52 1.86 6.37L4 29l7.83-1.83A11.9 11.9 0 0 0 16.02 27C22.64 27 28 21.62 28 15S22.64 3 16.02 3Zm6.98 16.9c-.3.83-1.72 1.6-2.38 1.68-.61.08-1.38.11-2.23-.14-.51-.15-1.17-.38-2.02-.74-3.55-1.53-5.87-5.1-6.05-5.34-.18-.24-1.44-1.92-1.44-3.66 0-1.74.91-2.6 1.24-2.95.32-.35.7-.44.94-.44.24 0 .47 0 .68.01.22.01.51-.08.8.61.3.72 1.02 2.48 1.11 2.66.09.18.15.39.03.63-.12.24-.18.39-.36.6-.18.21-.38.47-.54.63-.18.18-.37.38-.16.74.21.36.94 1.55 2.02 2.51 1.39 1.24 2.56 1.62 2.92 1.8.36.18.57.15.78-.09.21-.24.9-1.05 1.14-1.41.24-.36.48-.3.8-.18.33.12 2.08.98 2.44 1.16.36.18.6.27.69.42.09.15.09.87-.21 1.7Z"/></svg>
    <span>Написать в WhatsApp</span>
  </a>

  <div class="event-name">«Время быть ярче»</div>
</main>

<script>
(function(){
  // === НАСТРОЙКИ ===
  // Замените на реальный номер телефона в формате 7XXXXXXXXXX перед публикацией
  var WHATSAPP_PHONE = "79680699333";

  document.getElementById('waBtn').href = "https://wa.me/" + WHATSAPP_PHONE;

  // === Границы периодов (локальное время устройства) ===
  var OCT_1   = new Date(2026, 9, 1, 0, 0, 0, 0);   // 1 октября 2026, 00:00
  var NOV_1   = new Date(2026, 10, 1, 0, 0, 0, 0);  // 1 ноября 2026, 00:00
  var DEC_1   = new Date(2026, 11, 1, 0, 0, 0, 0);  // 1 декабря 2026, 00:00

  function getNow(){
    // Тестовая подмена даты: ?test=2026-11-15T12:00:00
    try{
      var params = new URLSearchParams(window.location.search);
      var testDate = params.get('test');
      if (testDate){
        var d = new Date(testDate);
        if (!isNaN(d.getTime())) return d;
      }
    }catch(e){}

    var now = new Date();
    if (isNaN(now.getTime())) {
      // Некорректная дата устройства — считаем, что сейчас сентябрь 2026
      return new Date(2026, 8, 15);
    }
    return now;
  }

  function formatPrice(n){
    return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " ₽";
  }

  function pad(n){
    return n < 10 ? "0" + n : String(n);
  }

  function render(){
    var now = getNow();

    var price, note, notePlain, showCountdown;

    if (now < OCT_1) {
      // до 30 сентября включительно (или некорректная/более ранняя дата)
      price = 2500;
      note = "Стоимость для групп от 15 детей";
      notePlain = false;
      showCountdown = true;
    } else if (now < NOV_1) {
      price = 2900;
      note = "Актуальная цена";
      notePlain = true;
      showCountdown = false;
    } else if (now < DEC_1) {
      price = 3900;
      note = "Актуальная цена";
      notePlain = true;
      showCountdown = false;
    } else {
      price = 4600;
      note = "Актуальная цена";
      notePlain = true;
      showCountdown = false;
    }

    document.getElementById('priceValue').textContent = formatPrice(price);

    var noteEl = document.getElementById('priceNote');
    noteEl.textContent = note;
    noteEl.classList.toggle('plain', notePlain);

    var cdWrap = document.getElementById('countdownWrap');

    if (showCountdown) {
      cdWrap.hidden = false;
      var diff = OCT_1.getTime() - now.getTime();
      if (diff < 0) diff = 0;

      var totalMinutes = Math.floor(diff / 60000);
      var days = Math.floor(totalMinutes / (60 * 24));
      var hours = Math.floor((totalMinutes % (60 * 24)) / 60);
      var minutes = totalMinutes % 60;

      document.getElementById('cdDays').textContent = pad(days);
      document.getElementById('cdHours').textContent = pad(hours);
      document.getElementById('cdMinutes').textContent = pad(minutes);
    } else {
      cdWrap.hidden = true;
    }
  }

  render();
  setInterval(render, 1000 * 15);

  // --- частицы ---
  function initParticles(){
    var container = document.getElementById('particles');
    var count = window.innerWidth < 480 ? 18 : 28;
    var colors = ['#ff6ec7', '#33e6ff', '#ffffff'];

    for (var i = 0; i < count; i++){
      var p = document.createElement('div');
      p.className = 'particle';
      var size = 2 + Math.random() * 3.5;
      var left = Math.random() * 100;
      var duration = 9 + Math.random() * 10;
      var delay = Math.random() * 14;
      var drift = (Math.random() * 80 - 40) + 'px';
      var opacity = 0.4 + Math.random() * 0.5;
      var color = colors[Math.floor(Math.random() * colors.length)];

      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = left + '%';
      p.style.background = color;
      p.style.boxShadow = '0 0 ' + (size * 2.5) + 'px ' + color;
      p.style.animationDuration = duration + 's';
      p.style.animationDelay = delay + 's';
      p.style.setProperty('--drift', drift);
      p.style.setProperty('--peak-opacity', opacity);

      container.appendChild(p);
    }
  }
  initParticles();
})();
</script>
</body>
</html>
